<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>

    <style>
        body{
            font-family: Arial;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .chat-box{
            width: 350px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        #message{
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        .msg{
            background: #d4edda;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
        }

        input{
            width: 75%;
            padding: 10px;
        }

        button{
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-box">
        <div id="message"></div>
        
        <input type="text" id="msg" placeholder="type message">
        <button onclick="sendmsg()">send</button>
        
    </div>
<script>
    function sendmsg() {
        let input = document.getElementById("msg");
        let message = input.value;
        if (message.trim() !==""){
            let msgBox = document.getElementById("message");
            msgBox.innerHTML += `
            <div class= "msg">${message}</div>
            `;
            input.value="";
            msgBox.scrollTop= msgBox.scrollHeight;
        }
    }
</script>
    

</body>
</html>
