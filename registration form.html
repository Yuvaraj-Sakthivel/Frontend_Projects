<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
}

.card{
    background: white;
    padding: 30px;
    width: 350px;
    border-radius: 40px;
    box-shadow: 0px 0px 50px rgba(235, 5, 212, 0.2);
    text-align: center;
}

.card input{
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #8284f3;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
}

.card input:focus{
    border-color: dodgerblue;
}

.card button{
    width: 100%;
    padding: 12px;
    border: none;
    background: dodgerblue;
    color: white;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.card button:hover{
    background: blue;
}
    </style>
</head>
<body>
    <form id="form">
        <div class="card">
        <input type="text" id="name" placeholder="Enter Your Name"><br>
        <input type="email" id="email" placeholder="Enter Your E-Mail"><br>
        <input type="number" id="num" placeholder="Enter Mobile Number"><br>
        <input type="password" id="pass" placeholder="Enter Password"><br>
        <button type="submit">Register</button>
        </div>
        <script>
            let form= document.getElementById("form");
        </script>
    </form>
</body>
</html>
